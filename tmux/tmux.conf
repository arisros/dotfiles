# Set prefix to Home key
unbind C-b  # Remove the default prefix (Ctrl-b)
unbind Home  # Remove the default prefix (Ctrl-b)
set-option -g prefix Home  # Set Home as the new prefix
set-option -g prefix2 C-b  # Set Ctrl-a as a secondary prefix
bind Home send-prefix  # Allow sending the prefix inside nested tmux sessions
bind C-b send-prefix -2 # Allow sending the secondary prefix inside nested tmux sessions
# Enable mouse support
set -g mouse on
set-option -g default-shell /bin/zsh

# Enable 256-color mode and true color
set-option -g default-terminal "tmux-256color"
set-option -sa terminal-overrides ",xterm-256color:Tc"

# Split panes (h = vertical, v = horizontal)
bind - split-window -h
bind v split-window -v

# Pane navigation (prefix + arrows  OR  prefix + HJKL)
bind -r Up    select-pane -U
bind -r Down  select-pane -D
bind -r Left  select-pane -L
bind -r Right select-pane -R
bind -r H     select-pane -L
bind -r J     select-pane -D
bind -r K     select-pane -U
bind -r L     select-pane -R

# Pane resizing (prefix + hjkl lowercase  OR  prefix + Shift+Arrows)
bind -r h resize-pane -L
bind -r j resize-pane -D
bind -r k resize-pane -U
bind -r l resize-pane -R
bind -r S-Up    resize-pane -U
bind -r S-Down  resize-pane -D
bind -r S-Left  resize-pane -L
bind -r S-Right resize-pane -R

# No-prefix nav (vim-tmux-navigator handles these; kept for non-vim panes)
bind -n C-h select-pane -L
bind -n C-j select-pane -D
bind -n C-k select-pane -U
bind -n C-l select-pane -R

# Navigation lock — press prefix+N to toggle. While ON, a pane-focus-in hook
# immediately re-selects the pane you were on, countering Claude Code's
# automatic focus steals when multi-agents are routing output between panes.
bind -r N run-shell \
  "if tmux show-option -gqv @nav_lock | grep -q 1; then \
     tmux set-option -g @nav_lock 0; \
     tmux set-hook -gu pane-focus-in; \
     tmux display-message 'Nav lock OFF'; \
   else \
     tmux set-option -g @nav_lock 1; \
     PANE=\$(tmux display-message -p '#D'); \
     tmux set-hook -g pane-focus-in \"run-shell 'tmux select-pane -t \$PANE'\"; \
     tmux display-message 'Nav lock ON (prefix+N to release)'; \
   fi"

bind-key g select-layout tiled

# Window management
bind c new-window  # Create new window
bind x kill-pane   # Close pane
bind w choose-tree # Show session & windows tree
bind & kill-window # Kill current window
bind Space next-window # Switch to next window

# Copy mode (vim-style)
setw -g mode-keys vi
bind-key -T copy-mode-vi v send -X begin-selection
bind-key -T copy-mode-vi y send -X copy-selection-and-cancel
bind-key -T copy-mode-vi Enter send -X copy-selection-and-cancel

set -g @minimal-tmux-indicator-str "●"
set -g @minimal-tmux-bg "red"
set -g @minimal-tmux-status "top"

set -g renumber-windows on   
set -g base-index 1 
set -g pane-base-index 1    

# Load TPM (Tmux Plugin Manager)
set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'tmux-plugins/tmux-sensible'
set -g @plugin 'tmux-plugins/tmux-resurrect'
set -g @plugin 'tmux-plugins/tmux-continuum'
set -g @plugin 'christoomey/vim-tmux-navigator'
set -g @plugin 'niksingh710/minimal-tmux-status'
set -g @plugin 'tmux-plugins/tmux-urlview' # open urls in terminal

set -g @tmux_navigator_no_mappings false  # Ensure default mappings are enabled
set -g @urlview-key 'o'
set -g @plugin 'tmux-plugins/tmux-yank'
set -g @resurrect-capture-pane-contents 'on'
set -g @continuum-restore 'on'

# set -g pane-border-format ''
set -g pane-border-format "[#[fg=white]#{?pane_active,#[bold],} :#(uname -s) #[fg=default,nobold]]"
# set -g pane-border-format "#[fg=cyan]#(uname -s) #[fg=default]:: pane #P"
set -g pane-border-lines heavy
set -g pane-border-status top

# set-hook -g pane-focus-in 'run-shell "tmux refresh-client -S"'
# run-shell "while true; do sleep 5 && tmux refresh-client -S; done" &



# Fix for macOS (if needed)
set -g focus-events on


# Session navigation — lets you freely switch away from Claude Code's managed
# agent panes (which own their session) without losing your work session.
bind-key -n F8  run-shell \
  "tmux has-session -t claude 2>/dev/null \
   && tmux switch-client -t claude \
   || tmux new-session -s claude -c '#{pane_current_path}'"
bind-key -n F9  switch-client -l   # toggle last session
bind-key -n F10 switch-client -n   # next session
bind-key -n F11 switch-client -p   # prev session

# Initialize TPM
run '~/.config/tmux/plugins/tpm/tpm'

