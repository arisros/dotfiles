# Set prefix to Home key
unbind C-b  # Remove the default prefix (Ctrl-b)
unbind Home  # Remove the default prefix (Ctrl-b)
set-option -g prefix Home  # Set Home as the new prefix
set-option -g prefix2 C-b  # Set Ctrl-a as a secondary prefix
bind Home send-prefix  # Allow sending the prefix inside nested tmux sessions
bind C-b send-prefix -2 # Allow sending the secondary prefix inside nested tmux sessions
# Enable mouse support
set -g mouse on

# Enable 256-color mode and true color
set-option -g default-terminal "tmux-256color"
set-option -sa terminal-overrides ",xterm-256color:Tc"

# Split panes (h = vertical, v = horizontal), keeping the current folder
bind - split-window -h -c '#{pane_current_path}'
bind v split-window -v -c '#{pane_current_path}'

# Pane navigation (Home + Arrow Keys)
bind -r Up select-pane -U
bind -r Down select-pane -D
bind -r Left select-pane -L
bind -r Right select-pane -R

# Pane resizing (Home + Shift + Arrows)
bind -r S-Up resize-pane -U
bind -r S-Down resize-pane -D
bind -r S-Left resize-pane -L
bind -r S-Right resize-pane -R

bind -n C-h select-pane -L
bind -n C-j select-pane -D
bind -n C-k select-pane -U
bind -n C-l select-pane -R


# Vim-style pane resizing
bind -r h resize-pane -L
bind -r j resize-pane -D
bind -r k resize-pane -U
bind -r l resize-pane -R

bind-key g select-layout tiled

# Window management
# New windows always start at $HOME, splits stay in the folder they came from.
bind c new-window -c '#{HOME}'

bind x if-shell 'tmux display-message -p "#{pane_current_command}" | grep -iqE "nvim|vim|copilot"' \
  'confirm-before -p "⚠ Active process detected (#{pane_current_command}). Kill pane anyway?" kill-pane' \
  'kill-pane'
# Window switcher: fzf popup listing every window of every session, with a live
# preview of the pane. The script falls back to choose-tree when fzf is missing.
bind w display-popup -E -w 85% -h 70% -b rounded -T ' windows ' '$HOME/.config/tmux/scripts/window-switcher.sh'
bind W choose-tree -Zw

# --- Scrolling a full-screen app with the keyboard ---------------------------
# claude, nvim & co draw on the alternate screen, where tmux keeps no scrollback
# at all - copy-mode there can only ever show the current frame, which is why it
# feels locked. Those apps do scroll themselves when the terminal reports a
# wheel event or PageUp, so on such a pane <prefix> [ enters a small scroll mode
# that forwards exactly that, driven by j/k like everywhere else. On a normal
# pane (a shell) tmux has real scrollback, so <prefix> [ stays plain copy-mode.
bind [ if-shell -F '#{alternate_on}' \
  'set @scroll_mode 1 ; set key-table scroll ; refresh-client' \
  'copy-mode'

bind -T scroll j        run-shell '$HOME/.config/tmux/scripts/pane-scroll.sh down 3'
bind -T scroll k        run-shell '$HOME/.config/tmux/scripts/pane-scroll.sh up 3'
bind -T scroll Down     run-shell '$HOME/.config/tmux/scripts/pane-scroll.sh down 3'
bind -T scroll Up       run-shell '$HOME/.config/tmux/scripts/pane-scroll.sh up 3'
bind -T scroll g        run-shell '$HOME/.config/tmux/scripts/pane-scroll.sh top'
bind -T scroll G        run-shell '$HOME/.config/tmux/scripts/pane-scroll.sh bottom'
bind -T scroll d        send-keys PageDown
bind -T scroll u        send-keys PageUp
bind -T scroll C-d      send-keys PageDown
bind -T scroll C-u      send-keys PageUp
bind -T scroll PageDown send-keys PageDown
bind -T scroll PageUp   send-keys PageUp

# leaving the mode - q/Escape/Enter/i, and Home so the prefix is never trapped
bind -T scroll q      set key-table root \; set @scroll_mode 0 \; refresh-client
bind -T scroll Escape set key-table root \; set @scroll_mode 0 \; refresh-client
bind -T scroll Enter  set key-table root \; set @scroll_mode 0 \; refresh-client
bind -T scroll i      set key-table root \; set @scroll_mode 0 \; refresh-client
bind -T scroll Home   set key-table root \; set @scroll_mode 0 \; refresh-client
# v hands over to the real copy-mode, to select and yank the visible frame
bind -T scroll v      set key-table root \; set @scroll_mode 0 \; copy-mode \; refresh-client
bind K kill-window   # ← pindah dari & ke K (kapital, lebih aman)
bind Space next-window

# Swap current window to specific position
bind ! swap-window -t 1
bind @ swap-window -t 2
bind '#' swap-window -t 3
bind '$' swap-window -t 4
bind '%' swap-window -t 5
bind '^' swap-window -t 6
bind '&' swap-window -t 7
bind '*' swap-window -t 8
bind '(' swap-window -t 9

bind Space next-window # Switch to next window

# Copy mode (vim-style)
setw -g mode-keys vi
bind-key -T copy-mode-vi v send -X begin-selection
bind-key -T copy-mode-vi y send -X copy-selection-and-cancel
bind-key -T copy-mode-vi Enter send -X copy-selection-and-cancel

set -g @minimal-tmux-indicator-str "●"
set -g @minimal-tmux-bg "red"
set -g @minimal-tmux-status "top"

# Built-in chooser, copy mode and popup styling
set -g mode-style 'fg=black bg=magenta bold'
set -g message-style 'fg=black bg=magenta bold'
set -g popup-border-style 'fg=magenta'
set -g popup-border-lines rounded

set -g renumber-windows on   
set -g base-index 1 
set -g pane-base-index 1    

# Load TPM (Tmux Plugin Manager)
set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'tmux-plugins/tmux-sensible'
set -g @plugin 'tmux-plugins/tmux-resurrect'
set -g @plugin 'tmux-plugins/tmux-continuum'
set -g @plugin 'christoomey/vim-tmux-navigator'
set -g @plugin 'niksingh710/minimal-tmux-status'
set -g @plugin 'tmux-plugins/tmux-urlview' # open urls in terminal

set -g @tmux_navigator_no_mappings false  # Ensure default mappings are enabled
set -g @urlview-key 'o'
set -g @plugin 'tmux-plugins/tmux-yank'
set -g @resurrect-capture-pane-contents 'on'
set -g @continuum-restore 'on'

# --- Pane and window labels --------------------------------------------------
# A claude pane advertises its session name through the terminal title, which
# tmux exposes as #{pane_title}. We only trust that title when the pane really
# runs claude - its process renames itself to the claude version ("2.1.251") -
# so shells, nvim and friends never leak a stale hostname title into a label.
set -g @pane_is_claude "#{&&:#{||:#{m:[0-9]*.[0-9]*.[0-9]*,#{pane_current_command}},#{m:claude*,#{pane_current_command}}},#{&&:#{!=:#{pane_title},#{host}},#{!=:#{pane_title},}}}"
set -g @pane_is_shell "#{||:#{==:#{pane_current_command},zsh},#{||:#{==:#{pane_current_command},bash},#{||:#{==:#{pane_current_command},fish},#{==:#{pane_current_command},sh}}}}"

# Pane border: [ folder ] for a plain pane, [ folder ] ✳ <session> for claude.
set -g pane-border-format "#{?pane_active,#[fg=green bold],#[fg=colour244]}[ #{b:pane_current_path} ]#[default]#{?#{E:@pane_is_claude}, #[fg=magenta bold]#{pane_title}#[default],}#{?#{&&:#{==:#{E:@scroll_mode},1},pane_active}, #[bg=magenta fg=black bold] SCROLL  j/k baris · d/u halaman · g/G ujung · q keluar #[default],}"

# Status bar tab name (#W of an auto-renamed window), instead of the bare
# process name - which for claude is its version number, e.g. "2.1.251":
#   claude -> ✳ <claude session name>   shell -> folder   otherwise -> command
set -g automatic-rename-format "#{?pane_in_mode,[copy],#{?#{E:@pane_is_claude},✳ #{=/16/…:#{s/✳ //:pane_title}},#{?#{E:@pane_is_shell},#{?#{==:#{pane_current_path},#{HOME}},~,#{b:pane_current_path}},#{pane_current_command}}}}#{?pane_dead,[dead],}"
# set -g pane-border-format "#[fg=cyan]#(uname -s) #[fg=default]:: pane #P"
set -g pane-border-lines heavy
set -g pane-border-status top

# set-hook -g pane-focus-in 'run-shell "tmux refresh-client -S"'
# run-shell "while true; do sleep 5 && tmux refresh-client -S; done" &



# Fix for macOS (if needed)
set -g focus-events on


# Initialize TPM
if-shell '[ -x ~/.config/tmux/plugins/tpm/tpm ]' 'run-shell ~/.config/tmux/plugins/tpm/tpm' ''
