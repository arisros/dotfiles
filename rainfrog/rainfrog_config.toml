# rainfrog — database TUI for PostgreSQL/MySQL/SQLite.
# https://github.com/achristmascarl/rainfrog
#
# Stowed to ~/.config/rainfrog; rainfrog finds it through RAINFROG_CONFIG
# (exported in zsh/.zshrc), otherwise it would use
# ~/Library/Application Support/dev.rainfrog.rainfrog on macOS.
#
# Only overrides live here — every key left out keeps rainfrog's own default,
# so upgrades can still add new bindings.

[settings]
# Keep the terminal's native mouse handling (tmux copy-mode, ghostty selection).
# Set to true if you'd rather click around inside rainfrog.
mouse_mode = false
data_compact_columns = true
data_row_spacer = false
autocomplete_enabled = true
autocomplete_debounce_ms = 100
autocomplete_trigger_len = 1
autopairs_enabled = true

[db]
# Frequently used connections, reachable from the menu on startup.
# NEVER put a password here: rainfrog asks once and stores it in the macOS
# Keychain (keyring crate), so this file stays safe to commit.
# Local containers are usually easier through `rfdb` (see zsh/.db_aliases),
# which reads host/port/user straight from the running container.
#
# <alias> = { driver = "postgres", host = "localhost", port = 5432, database = "<db>", username = "<user>" }

# ── Keybindings ──────────────────────────────────────────────────────────────
# Taken, and therefore unusable here:
#
#   Alt-*                 aerospace workspaces and window movement
#   Ctrl-b                tmux secondary prefix (primary is Home)
#   Ctrl-h/j/k/l, Ctrl-\  tmux root table and vim-tmux-navigator
#   Ctrl-arrows           macOS Mission Control, App Windows, Space switching
#   F1..F12               need fn, "F keys as standard" is off
#   Ctrl-e/y, f/b, r      rainfrog scroll, page, redo
#   Ctrl-p/n, Ctrl-space  rainfrog autocomplete
#   bare letters/digits   rainfrog's vim-style modal editor
#
# What is left free: Shift+arrows, Ctrl-g, Ctrl-s, Ctrl-o.
#
#   Shift-Left  menu        Shift-Up  editor        Shift-Down  query result
#   Shift-Right favorites   Ctrl-g    history       Tab         cycle panels
#   Ctrl-s      run query   Ctrl-o    open in nvim
#   Shift-PageUp/PageDown   resize panel
#   q outside the editor    cancel a running query

[keybindings.Menu]
"<Shift-left>" = "FocusMenu"
"<Shift-up>" = "FocusEditor"
"<Shift-down>" = "FocusData"
"<Shift-right>" = "FocusFavorites"
"<Ctrl-s>" = "SubmitEditorQuery"
"<Shift-pageup>" = "IncreaseSectionSize"
"<Shift-pagedown>" = "DecreaseSectionSize"

[keybindings.Editor]
"<Shift-left>" = "FocusMenu"
"<Shift-up>" = "FocusEditor"
"<Shift-down>" = "FocusData"
"<Shift-right>" = "FocusFavorites"
"<Ctrl-s>" = "SubmitEditorQuery"
"<Ctrl-o>" = "RequestExternalEditor"
"<Shift-pageup>" = "IncreaseSectionSize"
"<Shift-pagedown>" = "DecreaseSectionSize"

[keybindings.Data]
"<Shift-left>" = "FocusMenu"
"<Shift-up>" = "FocusEditor"
"<Shift-down>" = "FocusData"
"<Shift-right>" = "FocusFavorites"
"<Ctrl-s>" = "SubmitEditorQuery"
"<Shift-pageup>" = "IncreaseSectionSize"
"<Shift-pagedown>" = "DecreaseSectionSize"

[keybindings.History]
"<Shift-left>" = "FocusMenu"
"<Shift-up>" = "FocusEditor"
"<Shift-down>" = "FocusData"
"<Shift-right>" = "FocusFavorites"
"<Ctrl-s>" = "SubmitEditorQuery"
"<Shift-pageup>" = "IncreaseSectionSize"
"<Shift-pagedown>" = "DecreaseSectionSize"

[keybindings.Favorites]
"<Shift-left>" = "FocusMenu"
"<Shift-up>" = "FocusEditor"
"<Shift-down>" = "FocusData"
"<Shift-right>" = "FocusFavorites"
